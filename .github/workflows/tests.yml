name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify generated data file is up to date
        run: |
          node tools/build-data.mjs
          git diff --exit-code js/data/game-data.js

      - name: Verify docs/play is in sync
        run: |
          node tools/sync-docs-play.mjs
          git diff --exit-code ../docs/play

      - name: Run web logic tests
        run: node tests/logic.test.mjs

