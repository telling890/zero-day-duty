name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.1"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Generate icon
        run: python packaging/make_icon.py

      - name: Build onefile exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name ZeroDayDuty `
            --icon assets/icon.ico `
            --add-data "data;data" `
            --add-data "assets/icon.png;assets" `
            --version-file packaging/version_info.txt `
            main.py

      - name: Assemble portable zip
        run: |
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item dist/ZeroDayDuty.exe dist/portable/零日值班.exe -Force
          Copy-Item packaging/portable_readme.txt dist/portable/使用说明.txt -Force
          New-Item -ItemType Directory -Force dist/portable/saves | Out-Null
          Copy-Item saves/README.txt dist/portable/saves/README.txt -Force
          Compress-Archive -Path dist/portable/* -DestinationPath dist/ZeroDayDuty-Windows-x64.zip -Force

      - name: Selftest packaged exe
        run: |
          $process = Start-Process -FilePath "dist\ZeroDayDuty.exe" -ArgumentList "--selftest" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "packaged selftest failed" }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: 零日值班 ${{ inputs.tag }}
          files: |
            dist/ZeroDayDuty.exe
            dist/ZeroDayDuty-Windows-x64.zip
          fail_on_unmatched_files: true
